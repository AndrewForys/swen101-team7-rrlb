<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ritchie's Laundry Bag Item Catalog</title>
</head>
<body>
    <h1 style="text-align: center;">Ritchie's Rich Laundry Bag</h1>
    <input type="text" placeholder="Search for an item..." style="display: block; margin: 0 auto; width: 50%; padding: 10px; font-size: 16px;">
    <br>
    <div class="catalog" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">
        <div class="item" style="width: 200px; height: 300px; background-color: rgb(200, 83, 83); display: flex; flex-direction: column;">
            <img src="../images/hoodie.jpg" alt="Hoodie" width="200px" height="200px">
            <div class="item-details" style="text-align: center; background-color: rgb(83, 83, 83);">
                <p>Item: Hoodie<br>
                Color: Black<br>
                Pattern: Solid<br>
                Size: Medium<br>
                Brand: Nike<br>
                Features: Zipper, Pockets</p>
                <button><a href="submit.html">Request Item</a></button>
            </div>
        </div>

        <div class="item" style="width: 200px; height: 300px; background-color: rgb(83, 83, 200); display: flex; flex-direction: column;">
            <img src="../images/tshirt.jpg" alt="T-Shirt" width="200px" height="200px">
            <div class="item-details" style="text-align: center; background-color: rgb(83, 83, 83);">
                <p>Item: T-Shirt<br>
                Color: White<br>
                Pattern: Striped<br>
                Size: Large<br>
                Brand: Adidas<br>
                Features: Short Sleeves</p>
                <button><a href="submit.html">Request Item</a></button>
            </div>
        </div>
    </div>
    <br>
    <br>
    <br>
    <br>
    <div style="text-align: center;">
        <button><a href="main.html">Return to Home</a></button>
    </div>
</body>
</html>
