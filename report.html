<html>
  <head>
    <title>Ritchie's Laundry Bag</title>
  </head>
  <body>
  <h1>Report an Item</h1>
    <h2>Article type (select one)</h2>
      <select>
        <option>Select an option</option>
        <option>Shirt</option>
        <option>Pants</option>
        <option>Socks</option>
        <option>Jacket</option>
        <option>Other</option>
      </select>
    <h2>Colors (select at least one)</h2>
      <select>
        <option>Select an option</option>
        <option>Black</option>
        <option>White</option>
        <option>Blue</option>
        <option>Red</option>
        <option>Green</option>
        <option>Other</option>
      </select>
    <h2>Pattern (select at least one)</h2>
      <select>
        <option>Select an option</option>
        <option>Striped</option>
        <option>Plaid</option>
        <option>Solid</option>
        <option>Floral</option>
        <option>Other</option>
      </select>
    <h2>Features:</h2>
      <input type="checkbox" id="button" name="features" value="button">
      <label for="button">Button</label>
      <input type="checkbox" id="zipper" name="features" value="zipper">
      <label for="zipper">Zipper</label>
      <input type="checkbox" id="pocket" name="features" value="pocket">
      <label for="pocket">Pocket</label>
      <input type="checkbox" id="other" name="features" value="other">
      <label for="other">Other</label>

    <h2>Size:</h2>
      <input type="text" placeholder="Enter size">


    <h2>Brand (optional):</h2>
      <input type="text" placeholder="Enter brand name">
    <h2>Written Description</h2>
      <input type="text" placeholder="Enter a description of the item">
    <h2>Attach an image</h2>
      <button>Upload</button>

    <br>
    <button><a href="main.html">Return to Home</a></button>
    <br>
    <button><a href="submit.html">Submit</a></button>
    </body>
</html>
