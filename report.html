<html>
  <head>
    <title>Ritchie's Laundry Bag</title>
  </head>
  <body>
    <h1 style="text-align: center;">Report an Item</h1>
    <h2 style="text-align: center;">Article type (select one)</h2>
    <div style="text-align: center;">
      <select style="text-align: center;">
        <option>Select an option</option>
        <option>Shirt</option>
        <option>Pants</option>
        <option>Socks</option>
        <option>Jacket</option>
        <option>Other</option>
      </select>
    </div>
    <h2 style="text-align: center;">Colors (select at least one)</h2>
    <div style="text-align: center;">
      <select style="text-align: center;">
        <option>Select an option</option>
        <option>Black</option>
        <option>White</option>
        <option>Blue</option>
        <option>Red</option>
        <option>Green</option>
        <option>Other</option>
      </select>
    </div>
    <h2 style="text-align: center;">Pattern (select at least one)</h2>
    <div style="text-align: center;">
      <select style="text-align: center;">
        <option>Select an option</option>
        <option>Striped</option>
        <option>Plaid</option>
        <option>Solid</option>
        <option>Floral</option>
        <option>Other</option>
      </select>
    </div>
    <h2 style="text-align: center;">Features:</h2>
    <div style="text-align: center;">
      <input type="checkbox" id="button" name="features" value="button">
      <label for="button">Button</label>
      <input type="checkbox" id="zipper" name="features" value="zipper">
      <label for="zipper">Zipper</label>
      <input type="checkbox" id="pocket" name="features" value="pocket">
      <label for="pocket">Pocket</label>
      <input type="checkbox" id="other" name="features" value="other">
      <label for="other">Other</label>
    </div>
    <h2 style="text-align: center;">Size:</h2>
    <div style="text-align: center;">
      <select style="text-align: center;">
        <option value="">Select a size</option>
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
        <option value="x-large">X-Large</option>
      </select>
    </div>
    <h2 style="text-align: center;">Brand (optional):</h2>
    <div style="text-align: center;">
      <input style="text-align: center;" type="text" placeholder="Enter brand name">
    </div>
    <h2 style="text-align: center;">Written Description</h2>
    <div style="text-align: center;">
      <input style="text-align: center;" type="text" placeholder="Description">
    </div>
    <h2 style="text-align: center;">Attach an image</h2>
    <div style="text-align: center;">
      <button>Upload</button>
    </div>

    <br>
    <button><a href="main.html">Return to Home</a></button>
    <br>
    <button><a href="submit.html">Submit</a></button>
    </body>
</html>
